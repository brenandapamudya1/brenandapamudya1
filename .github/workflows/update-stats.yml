name: Update GitHub Stats

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-stats:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests

      - name: Fetch GitHub Stats & Update SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_USERNAME: brenandapamudya1
        run: python3 scripts/update_stats.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add neofetch.svg
          if [ -d cache ]; then git add cache/; fi
          git diff --staged --quiet || git commit -m "Auto-update GitHub stats"
          git push
